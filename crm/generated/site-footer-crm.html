<script>
/*! webflow-ghl-integration — crm-hidden-fields.js
 *
 * Adds hidden context fields to Webflow forms so GoHighLevel knows what each sign-up is for and where it
 * came from. Values come from the current page and the form only, read on page load and again at submit
 * time (capture phase, before Webflow's own handler collects the inputs). Nothing is stored in the browser.
 *
 * Generated by scaffold.py for "probuild-group" — edit crm/project-config.json and re-run, not this file. Inspect without sending: window.webCrm.context(form)
 * Never test with form.submit(), requestSubmit() or a dispatched submit event — that sends real data.
 */
(function (root) {
  var CONFIG = {
    "level": "full",
    "formSelector": ".w-form form",
    "keyAttribute": "data-crm-key",
    "names": {
      "form_key": "form_key",
      "purpose": "purpose",
      "subject": "subject",
      "page_path": "page_path",
      "prev_path": "prev_path",
      "site_host": "site_host",
      "page_lang": "page_lang",
      "phone_e164": "phone_e164",
      "date_iso": "date_iso",
      "referrer_host": "referrer_host",
      "channel": "channel"
    },
    "forms": {
      "dd2304bf-c927-eda7-8438-babe29a04994": {
        "key": "kalkulators",
        "purpose": "Cenas piedāvājums (kalkulators)",
        "subject": "Cenas piedāvājums: {aprekins_joma}, ≈ {aprekins_summa} €|Cenas piedāvājums: {aprekins_joma}|Cenas piedāvājuma pieprasījums"
      },
      "dd2304bf-c927-eda7-8438-babe29a049e5": {
        "key": "pakalpojuma-pieteikums",
        "purpose": "{service}|Pakalpojuma pieteikums",
        "subject": "Pieteikums: {service}|Pakalpojuma pieteikums"
      },
      "4d10121b-a9de-c7da-8368-dcad032a656a": {
        "key": "kontaktforma",
        "purpose": "{service}|Jautājums",
        "subject": "Kontaktforma: {service}|Jautājums no mājaslapas"
      },
      "e86c52af-94a3-9432-bf15-ea2220226664": {
        "key": "nomas-pieprasijums",
        "purpose": "Tehnikas noma",
        "subject": "Tehnikas noma no {no}|Tehnikas noma"
      },
      "f722b463-050e-f37c-ca3b-cbe6ed38bd20": {
        "key": "nomas-produkts",
        "purpose": "Tehnikas noma",
        "subject": "Noma: {produkts}, {datums}|Noma: {produkts}|Tehnikas noma"
      },
      "b8fd0538-e508-3c03-e0ae-0791d216d596": {
        "key": "lidzigs-projekts",
        "purpose": "Līdzīgs projekts",
        "subject": "Līdzīgs projekts: {projekts}|Līdzīgs projekts"
      }
    },
    "otherForm": {
      "key": "other",
      "purpose": "Jautājums",
      "subject": "Pieteikums"
    },
    "serviceField": "select[name=\"pakalpojums\"], [name=\"interese\"]:checked",
    "varFields": {
      "aprekins_joma": "[name=\"aprekins_joma\"]",
      "aprekins_summa": "[name=\"aprekins_summa\"]",
      "datums": "[name=\"datums\"]",
      "no": "[name=\"no\"]",
      "produkts": "[name=\"produkts\"]",
      "projekts": "[name=\"projekts\"]"
    },
    "messageField": "[name=\"zina\"], [name=\"aprekins\"]",
    "phoneField": "[name=\"telefons\"]",
    "dateField": "",
    "picks": [],
    "phone": {
      "country": "371",
      "nationalLength": 8,
      "nationalStart": "[2689]",
      "trunkPrefix": ""
    },
    "date": {
      "order": "dmy",
      "pastDays": 366,
      "futureDays": 1098
    },
    "unknownChannel": "tiešs / nezināms",
    "maxLength": 100
  };

  function host(h) { return (h || '').toLowerCase().replace(/^www\./, ''); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function val(form, sel) {
    if (!sel) return '';
    var els = form.querySelectorAll(sel);
    for (var i = 0; i < els.length; i++) {
      var el = els[i], t = String(el.type || '').toLowerCase();
      if (t === 'radio' || t === 'checkbox') {   // only the ticked one counts; Webflow sends "true" for a ticked box
        if (el.checked) return String(el.value && el.value !== 'on' ? el.value : 'true').trim();
        continue;
      }
      return String(el.value || '').trim();
    }
    return '';
  }

  // Typed phone → E.164; empty when unsure (GHL then keeps a stored phone; the typed text stays in its field)
  function phone(raw) {
    var p = CONFIG.phone, s = String(raw || ''), plus = /^\s*\+/.test(s), d = s.replace(/\D/g, '');
    if (!plus && d.indexOf('00') === 0) { plus = true; d = d.slice(2); }
    var lens = [].concat(p.nationalLength || 0), min = lens[0], max = lens[lens.length - 1];   // a length or [min, max]
    function fits(n) { return min > 0 && n >= min && n <= max; }
    if (p.country && min) {
      if (!plus && p.trunkPrefix && d.indexOf(p.trunkPrefix) === 0 && fits(d.length - p.trunkPrefix.length)) {
        d = d.slice(p.trunkPrefix.length);
      }
      if (!plus && fits(d.length) && new RegExp('^' + p.nationalStart).test(d)) return '+' + p.country + d;
      if (d.indexOf(p.country) === 0 && fits(d.length - p.country.length)) return '+' + d;
    }
    return plus && d.length >= 8 && d.length <= 15 ? '+' + d : '';
  }

  // Typed date → YYYY-MM-DD built from the numbers (no time-zone shift); empty when unsure
  function isoDate(raw, now) {
    var c = CONFIG.date, s = String(raw || '').trim().replace(/\.$/, ''), m, y, mo, d;
    if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = /^(\d{1,2})\s*[.\/\- ]\s*(\d{1,2})(?:\s*[.\/\- ]\s*(\d{4}|\d{2}))?$/.exec(s))) {
      if (c.order === 'mdy') { mo = +m[1]; d = +m[2]; } else { d = +m[1]; mo = +m[2]; }
      y = m[3] ? +m[3] : 0;
      if (y && y < 100) y += 2000;
    } else return '';
    now = now || new Date();
    var day = 864e5, today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    if (!y) { y = now.getFullYear(); if (Date.UTC(y, mo - 1, d) < today) y++; }
    var t = Date.UTC(y, mo - 1, d), chk = new Date(t);
    if (chk.getUTCFullYear() !== y || chk.getUTCMonth() !== mo - 1 || chk.getUTCDate() !== d) return '';
    if (t < today - c.pastDays * day || t > today + c.futureDays * day) return '';
    return y + '-' + pad(mo) + '-' + pad(d);
  }

  function picked(text, label) {
    // label: one text, or a list of alternatives (the same choice written on localized pages)
    var alts = [].concat(label).map(esc).join('|');
    var out = [], re = new RegExp('(?:' + alts + '):\\s*([^.\\n]+)', 'g'), m;
    while ((m = re.exec(text))) { var v = m[1].trim(); if (v && out.indexOf(v) === -1) out.push(v); }
    return out.join(', ');
  }

  function fill(template, vars) {
    var alts = String(template || '').split('|');
    for (var i = 0; i < alts.length; i++) {
      var ok = true;
      var out = alts[i].replace(/\{(\w+)\}/g, function (_, k) { var v = vars[k] || ''; if (!v) ok = false; return v; });
      if (ok && out.trim()) return out.trim();
    }
    return '';
  }

  function formDef(form, path) {
    var def = CONFIG.forms[form.getAttribute('data-wf-element-id')], attr = CONFIG.keyAttribute && form.getAttribute(CONFIG.keyAttribute);
    if (attr) {
      def = null;
      Object.keys(CONFIG.forms).forEach(function (id) { if (!def && CONFIG.forms[id].key === attr) def = CONFIG.forms[id]; });
      def = def || { key: attr };
    }
    def = def || CONFIG.otherForm;
    var key = def.key, rules = def.byPath || [];
    for (var i = 0; i < rules.length; i++) {
      if (new RegExp(rules[i][0]).test(path)) { key = rules[i][1]; break; }
    }
    return { key: key, purpose: def.purpose || CONFIG.otherForm.purpose, subject: def.subject || CONFIG.otherForm.subject };
  }

  function context(form) {
    var n = CONFIG.names, full = CONFIG.level === 'full';
    var path = location.pathname.replace(/\/$/, '') || '/';
    var here = host(location.hostname);
    var def = formDef(form, path);
    var msg = val(form, CONFIG.messageField);
    if (msg.normalize) msg = msg.normalize('NFC');

    var vars = { service: val(form, CONFIG.serviceField), form: def.key };
    Object.keys(CONFIG.varFields || {}).forEach(function (k) { vars[k] = val(form, CONFIG.varFields[k]); });
    CONFIG.picks.forEach(function (p) { vars[p.key] = picked(msg, p.label); });

    var v = {}, order = [n.form_key, n.purpose, n.subject];
    v[n.form_key] = def.key;
    v[n.purpose] = fill(def.purpose, vars);
    v[n.subject] = fill(def.subject, vars);
    if (full) CONFIG.picks.forEach(function (p) { v[p.key] = vars[p.key]; order.push(p.key); });
    v[n.page_path] = path;
    order.push(n.page_path);

    if (full) {
      var ref = null;
      try { ref = document.referrer ? new URL(document.referrer) : null; } catch (e) {}
      var same = !!ref && host(ref.hostname) === here;
      var q = new URLSearchParams(location.search);
      v[n.prev_path] = same ? ref.pathname : '';
      v[n.site_host] = here;
      v[n.page_lang] = (document.documentElement && document.documentElement.getAttribute('lang')) || '';
      v[n.phone_e164] = phone(val(form, CONFIG.phoneField));
      v[n.date_iso] = isoDate(val(form, CONFIG.dateField));
      order.push(n.prev_path, n.site_host, n.page_lang, n.phone_e164, n.date_iso);
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].forEach(function (k) {
        v[k] = (q.get(k) || '').trim().slice(0, CONFIG.maxLength);
        order.push(k);
      });
      v[n.referrer_host] = ref && !same ? host(ref.hostname) : '';
      // Ad click IDs are not kept, only which network they mean
      v[n.channel] = v.utm_source || (q.get('gclid') ? 'google-ads' : q.get('fbclid') ? 'meta-ads' : q.get('msclkid') ? 'microsoft-ads' : '') ||
        v[n.referrer_host] || CONFIG.unknownChannel;
      order.push(n.referrer_host, n.channel);
    } else {
      v[n.site_host] = here;
      order.push(n.site_host);
    }

    order.forEach(function (name) {
      var input = form.querySelector('input[type="hidden"][name="' + name + '"]');
      if (!input) {
        input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.setAttribute('data-name', name); // webflow.js collects inputs by data-name
        form.appendChild(input);
      }
      input.value = v[name] || '';
    });
    return v;
  }

  root.webCrm = { context: context, config: CONFIG, _test: { phone: phone, isoDate: isoDate, picked: picked, fill: fill } };

  if (typeof document === 'undefined' || !document.querySelectorAll) return; // loaded by the tests
  document.querySelectorAll(CONFIG.formSelector).forEach(context);
  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (form && form.matches && form.matches(CONFIG.formSelector)) context(form);
  }, true);
})(typeof window !== 'undefined' ? window : this);
</script>
