<div class="pbc" data-pbc data-calc-mode="calc">
  <noscript><p>Kalkulatoram vajadzīgs JavaScript. Precīzu cenas piedāvājumu var pieprasīt pa tālruni +371 26 518 131.</p></noscript>
</div>
<script>
/* ==========================================================================
   PROBUILD CENU KALKULATORS
   Cenas ir atsevišķos Code Embed elementos „Cenas: …” (pa vienam katrai jomai).
   Šeit var labot tekstus, mērvienības un pakalpojumu saites. Zem iestatījumiem
   ir kalkulatora kods, to labot nevajag.
   ========================================================================== */
window.PBC_SETTINGS = {
  title: 'Aprēķiniet darbu izmaksas',
  intro: 'Izvēlieties darbus un norādiet apjomu. Aptuveno cenu redzēsiet uzreiz, bet precīzu cenas piedāvājumu sagatavosim jums.',
  areaLabel: 'Joma',
  worksLabel: 'Darbi un apjoms',
  search: 'Meklēt darbu, piem. flīzēšana',
  resultLabel: 'Aptuvenās izmaksas',
  resultEmpty: 'Atzīmējiet darbus sarakstā, un aprēķins parādīsies šeit.',
  cta: 'Saņemt precīzu cenas piedāvājumu',
  ctaHint: 'Vispirms atzīmējiet vismaz vienu darbu.',
  ctaNote: 'Bez saistībām. Precīzu cenu nosakām pēc objekta apskates.',
  generalNote: 'Cenas ir orientējošas 2026. gada aplēses, nevis saistošs piedāvājums.',
  // Ja lapā nav formas ar atribūtu data-pbc-form, poga ved uz šo adresi.
  fallbackUrl: '/kontakti',

  // Mērvienības, ko izmanto cenu rindās. price: teksts aiz cenas; qty: teksts aiz daudzuma
  // (viens vārds vai [vienskaitlis, daudzskaitlis]); visits: cenu reizina arī ar reižu skaitu;
  // monthly: ikmēneša maksa (rāda atsevišķi no vienreizējiem darbiem).
  units: {
    'm2':         { price: '€/m²', qty: 'm²' },
    'm3':         { price: '€/m³', qty: 'm³' },
    'm3 izejm.':  { price: '€/m³ izejmateriāla', qty: 'm³' },
    'm':          { price: '€/tek. m', qty: 'tek. m' },
    'm kanāls':   { price: '€/tek. m kanālam', qty: 'tek. m' },
    'h':          { price: '€/h', qty: 'h' },
    'gab':        { price: '€/gab.', qty: 'gab.' },
    'kompl':      { price: '€/kompl.', qty: 'kompl.' },
    't':          { price: '€/t', qty: 't' },
    'kg':         { price: '€/kg', qty: 'kg' },
    'diena':      { price: '€/diena', qty: ['diena', 'dienas'] },
    'reize':      { price: '€/reize', qty: ['reize', 'reizes'] },
    'brauciens':  { price: '€/brauciens', qty: ['brauciens', 'braucieni'] },
    'izbraukums': { price: '€/izbraukums', qty: ['izbraukums', 'izbraukumi'] },
    'griezums':   { price: '€/griezums', qty: ['griezums', 'griezumi'] },
    'pasūtījums': { price: '€/pasūtījums', qty: ['pasūtījums', 'pasūtījumi'] },
    'koks':       { price: '€/koks', qty: ['koks', 'koki'] },
    'celms':      { price: '€/celms', qty: ['celms', 'celmi'] },
    'objekts':    { price: '€/objekts', qty: ['objekts', 'objekti'] },
    'izsaukums':  { price: '€/izsaukums', qty: ['izsaukums', 'izsaukumi'] },
    'm2 reizē':   { price: '€/m² reizē', qty: 'm²', visits: true },
    'm2 mēnesī':  { price: '€/m² mēnesī', qty: 'm²', monthly: true },
    'mēnesī':     { price: '€ mēnesī', qty: ['objekts', 'objekti'], monthly: true }
  },

  // Pakalpojumu saraksta pogas un pakalpojumu lapas atver kalkulatoru šajā vietā:
  // 'jomas id > grupas nosaukums' (jomas id ir rakstīts katrā „Cenas: …” blokā).
  services: {
    'Pamatu būvniecība': 'buvnieciba > Pamati',
    'Jumta darbi': 'buvnieciba > Jumts',
    'Fasādes darbi': 'buvnieciba > Fasāde',
    'Inženiertīklu un komunikāciju izbūve': 'buvnieciba > Komunikācijas',
    'Drenāžas un meliorācijas darbi': 'buvnieciba > Komunikācijas',
    'Apzaļumošana un labiekārtošana': 'buvnieciba > Apzaļumošana un labiekārtošana',
    'Ēku renovācija un rekonstrukcija': 'remontdarbi > Sienas',
    'Remonta un apdares darbi': 'remontdarbi > Sienas',
    'Demontāža un konstrukciju nojaukšana': 'remontdarbi > Demontāžas darbi',
    'Būvgružu izvešana un utilizācija': 'remontdarbi > Demontāžas darbi',
    'Metālapstrāde': 'metalapstrade',
    'Kokapstrāde': 'kokapstrade',
    'Ēku apsaimniekošana un uzturēšana': 'apsaimniekosana > Apsaimniekošana',
    'Koku zāģēšana un apauguma novākšana': 'apsaimniekosana > Koku darbi'
  }
};

/* ====== Kalkulatora kods (labot nevajag) ================================= */
(function () {
  'use strict';
  var S = window.PBC_SETTINGS, UNITS = S.units, api = null, pending = null;
  // Other scripts and links: pbCalc.show('Jumta darbi') or ?pakalpojums=Jumta%20darbi
  window.pbCalc = {
    has: function (name) { return !!S.services[name]; },
    show: function (name) { if (api) return api.show(name); pending = name; return true; },
    reset: function () { if (api) api.reset(); }
  };
  // Keeps the request form hidden until the visitor asks for the offer (see the CSS).
  document.documentElement.classList.add('pbc-on');
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  function init() {
    var root = document.querySelector('[data-pbc]');
    if (!root || root.hasAttribute('data-pbc-ready')) return;
    root.setAttribute('data-pbc-ready', '');

    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finePointer = window.matchMedia && matchMedia('(pointer: fine)').matches;
    var nf0 = new Intl.NumberFormat('lv-LV', { maximumFractionDigits: 0, useGrouping: 'always' });
    var nf2 = new Intl.NumberFormat('lv-LV', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' });
    var nfq = new Intl.NumberFormat('lv-LV', { maximumFractionDigits: 2, useGrouping: false });
    var minus = function (s) { return s.replace('-', '−'); };
    var money = function (n) {
      var r = Math.round(n * 100) / 100;
      return minus(Math.abs(r) >= 100 || r === Math.round(r) ? nf0.format(Math.round(r)) : nf2.format(r)) + ' €';
    };
    var rate = function (n) { return minus(n === Math.round(n) ? nf0.format(n) : nf2.format(n)); };
    var esc = function (s) {
      return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
    };
    var fold = function (s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
    var word = function (forms, n) {
      if (typeof forms === 'string') return forms;
      var i = Math.abs(Math.round(n));
      return i % 10 === 1 && i % 100 !== 11 ? forms[0] : forms[1];
    };

    // Price data from the „Cenas: …” embeds
    var AREAS = [], ITEMS = {};
    (window.PBC_DATA || []).slice().sort(function (a, b) { return (a.order || 99) - (b.order || 99); }).forEach(function (a) {
      var area = { id: a.id, name: a.name, intro: a.intro || '', note: a.note || '', groups: [] };
      (a.groups || []).forEach(function (g, gi) {
        var group = { name: g.group, area: area, items: [] };
        (g.items || []).forEach(function (r, ii) {
          var it = { id: a.id + '.' + gi + '.' + ii, area: area, group: group, name: String(r[0]), unitKey: r[1],
            from: Number(r[2]), price: Number(r[3]), to: Number(r[4]), note: r[5] ? String(r[5]) : '' };
          it.unit = UNITS[r[1]];
          if (!it.unit) {
            console.warn('[Kalkulators] Nezināma mērvienība „' + r[1] + '”: ' + it.name);
            it.unit = { price: '€/' + r[1], qty: String(r[1]) };
          }
          if (isNaN(it.from) || isNaN(it.price) || isNaN(it.to)) { console.warn('[Kalkulators] Cena nav skaitlis: ' + it.name); return; }
          if (!(it.from <= it.price && it.price <= it.to)) console.warn('[Kalkulators] Jābūt: cena no ≤ ieteicamā ≤ cena līdz: ' + it.name);
          it.key = fold(it.name + ' ' + group.name + ' ' + area.name);
          group.items.push(it);
          ITEMS[it.id] = it;
        });
        if (group.items.length) area.groups.push(group);
      });
      if (area.groups.length) AREAS.push(area);
    });
    if (!AREAS.length) {
      document.documentElement.classList.remove('pbc-on');
      root.innerHTML = '<p class="pbc_intro">Kalkulators šobrīd nav pieejams. Precīzu cenas piedāvājumu var pieprasīt pa tālruni +371 26 518 131.</p>';
      return;
    }

    var st = { a: 0, g: 0, q: '' };
    var picked = {}, order = [], lastQty = {};

    // The Webflow form that sends the request: hidden until the visitor asks for the offer.
    var formEl = document.querySelector('[data-pbc-form]');
    var formBlock = formEl && (formEl.closest('.w-form') || formEl);
    var form = formEl && (formEl.tagName === 'FORM' ? formEl : formEl.querySelector('form'));

    var icon = {
      search: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.75"/><path d="m13 13 4.5 4.5" stroke-linecap="round"/></svg>',
      arrow: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10h11m-4.5-5 5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };
    root.innerHTML =
      '<div class="pbc_head"><h2 class="pbc_title">' + esc(S.title) + '</h2><p class="pbc_intro">' + esc(S.intro) + '</p></div>' +
      '<div class="pbc_step"><div class="pbc_label" id="pbc-l1"><span class="pbc_num">1</span>' + esc(S.areaLabel) + '</div>' +
        '<div class="pbc_pills" role="group" aria-labelledby="pbc-l1" data-areas></div><p class="pbc_area-intro" data-area-intro></p></div>' +
      '<div class="pbc_step" data-works><div class="pbc_label" id="pbc-l2"><span class="pbc_num">2</span>' + esc(S.worksLabel) + '</div>' +
        '<div class="pbc_search">' + icon.search + '<input class="pbc_search-input" type="search" enterkeyhint="search" autocomplete="off" ' +
          'aria-label="Meklēt darbu" placeholder="' + esc(S.search) + '" data-search><button type="button" class="pbc_clear" aria-label="Notīrīt meklēšanu" data-clear hidden>×</button></div>' +
        '<div class="pbc_pills is-small" role="group" aria-label="Darbu grupa" data-groups></div>' +
        '<p class="pbc_found" data-found hidden></p>' +
        '<ul class="pbc_list" role="list" aria-labelledby="pbc-l2" data-list></ul></div>' +
      '<div class="pbc_result" data-result></div>' +
      '<div class="pbc_bar" data-bar aria-hidden="true"><span class="pbc_bar-total" data-bar-total></span><span class="pbc_bar-count" data-bar-count></span>' +
        '<button type="button" class="pbc_bar-btn" tabindex="-1" data-to-result>Skatīt aprēķinu</button></div>' +
      '<p class="pbc_sr" aria-live="polite" data-status></p>';
    var $ = function (s) { return root.querySelector(s); };
    var el = { areas: $('[data-areas]'), areaIntro: $('[data-area-intro]'), groups: $('[data-groups]'), list: $('[data-list]'),
      search: $('[data-search]'), clear: $('[data-clear]'), found: $('[data-found]'), result: $('[data-result]'),
      bar: $('[data-bar]'), works: $('[data-works]'), status: $('[data-status]') };

    // Totals
    function line(id) {
      var it = ITEMS[id], p = picked[id], n = (p.q || 0) * (it.unit.visits ? (p.v || 0) : 1);
      return { it: it, p: p, n: n, lo: n * it.from, mid: n * it.price, hi: n * it.to };
    }
    function totals() {
      var t = { once: { lo: 0, mid: 0, hi: 0, n: 0 }, month: { lo: 0, mid: 0, hi: 0, n: 0 }, lines: order.map(line) };
      t.lines.forEach(function (l) {
        if (!(l.n > 0)) return;
        var b = l.it.unit.monthly ? t.month : t.once;
        b.lo += l.lo; b.mid += l.mid; b.hi += l.hi; b.n++;
      });
      return t;
    }
    var countIn = function (test) { return order.filter(function (id) { return test(ITEMS[id]); }).length; };
    var range = function (lo, hi, sep) { return lo === hi ? money(lo) : money(lo).replace(' €', '') + (sep || '–') + money(hi); };
    var qtyText = function (it, p) {
      var s = nfq.format(p.q) + ' ' + word(it.unit.qty, p.q);
      return it.unit.visits ? s + ' × ' + nfq.format(p.v) + ' ' + word(['reize', 'reizes'], p.v) : s;
    };

    // Step 1 and the group pills
    function pill(attr, i, label, count, on) {
      return '<button type="button" class="pbc_pill" ' + attr + '="' + i + '" aria-pressed="' + on + '">' + esc(label) +
        (count ? '<span class="pbc_badge" aria-label="izvēlēti ' + count + '">' + count + '</span>' : '') + '</button>';
    }
    function renderPills() {
      var area = AREAS[st.a];
      el.areas.innerHTML = AREAS.map(function (a, i) {
        return pill('data-area', i, a.name, countIn(function (it) { return it.area === a; }), !st.q && i === st.a);
      }).join('');
      el.areaIntro.textContent = area.intro;
      el.groups.innerHTML = area.groups.map(function (g, i) {
        return pill('data-group', i, g.name, countIn(function (it) { return it.group === g; }), i === st.g);
      }).join('');
      el.groups.hidden = !!st.q;
    }

    // Step 2: the work list (one group, or search results across all areas)
    function mark(name) {
      if (!st.q) return esc(name);
      var f = fold(name), hits = [];
      st.q.split(' ').forEach(function (w) {
        var i = f.indexOf(w);
        if (w && i >= 0) hits.push([i, i + w.length]);
      });
      hits.sort(function (a, b) { return a[0] - b[0]; });
      var out = '', pos = 0;
      hits.forEach(function (h) {
        if (h[0] < pos) return;
        out += esc(name.slice(pos, h[0])) + '<mark>' + esc(name.slice(h[0], h[1])) + '</mark>';
        pos = h[1];
      });
      return out + esc(name.slice(pos));
    }
    function stepper(it, k, val, unit, label) {
      return '<span class="pbc_qty"><button type="button" class="pbc_step-btn" data-step="-1" data-k="' + k + '" aria-label="' + esc(label) + ': mazāk">−</button>' +
        '<input class="pbc_qty-input" data-k="' + k + '" inputmode="decimal" autocomplete="off" value="' + nfq.format(val) + '" aria-label="' + esc(label + ', ' + it.name) + '">' +
        '<span class="pbc_qty-unit" data-unit="' + k + '">' + esc(unit) + '</span>' +
        '<button type="button" class="pbc_step-btn" data-step="1" data-k="' + k + '" aria-label="' + esc(label) + ': vairāk">+</button></span>';
    }
    function moreHTML(it) {
      var p = picked[it.id];
      if (!p) return '';
      var h = '<div class="pbc_qty-row">' + stepper(it, 'q', p.q, word(it.unit.qty, p.q), 'Daudzums');
      if (it.unit.visits) h += '<span class="pbc_times" aria-hidden="true">×</span>' + stepper(it, 'v', p.v, word(['reize', 'reizes'], p.v), 'Reizes');
      h += '<span class="pbc_item-sum" data-sum></span></div>';
      if (it.note) h += '<p class="pbc_item-note">' + esc(it.note) + '</p>';
      return h;
    }
    function itemHTML(it) {
      var on = !!picked[it.id];
      var meta = st.q ? it.area.name + ' › ' + it.group.name : (it.from === it.to ? '' : 'Diapazons ' + rate(it.from) + '–' + rate(it.to) + ' ' + it.unit.price);
      return '<li class="pbc_item' + (on ? ' is-on' : '') + '" data-id="' + it.id + '">' +
        '<label class="pbc_item-main"><input type="checkbox" class="pbc_check"' + (on ? ' checked' : '') + '><span class="pbc_box" aria-hidden="true"></span>' +
        '<span class="pbc_item-text"><span class="pbc_item-name">' + mark(it.name) + '</span>' + (meta ? '<span class="pbc_item-meta">' + esc(meta) + '</span>' : '') + '</span>' +
        '<span class="pbc_item-price">' + rate(it.price) + ' ' + esc(it.unit.price) + '</span></label>' +
        '<div class="pbc_item-more"><div class="pbc_item-inner">' + moreHTML(it) + '</div></div></li>';
    }
    function visibleItems() {
      if (!st.q) return AREAS[st.a].groups[st.g].items;
      var words = st.q.split(' ').filter(Boolean), out = [];
      AREAS.forEach(function (a) { a.groups.forEach(function (g) { g.items.forEach(function (it) {
        if (words.every(function (w) { return it.key.indexOf(w) >= 0; })) out.push(it);
      }); }); });
      return out;
    }
    function renderList() {
      var items = visibleItems();
      el.found.hidden = !st.q;
      el.found.textContent = items.length ? 'Atrasti darbi: ' + items.length : 'Nekas netika atrasts. Pamēģiniet citu vārdu vai izvēlieties jomu.';
      el.list.hidden = !items.length;
      el.list.innerHTML = items.map(itemHTML).join('');
      el.list.scrollTop = 0;
      items.forEach(function (it) { if (picked[it.id]) updateRow(it.id); });
    }
    function rowOf(id) { return el.list.querySelector('[data-id="' + id + '"]'); }
    function updateRow(id) {
      var li = rowOf(id), it = ITEMS[id], p = picked[id];
      if (!li || !p) return;
      var l = line(id), sum = li.querySelector('[data-sum]');
      if (sum) sum.textContent = l.n > 0 ? '≈ ' + money(l.mid) + (it.unit.monthly ? ' mēnesī' : '') : 'Norādiet apjomu';
      var u = li.querySelector('[data-unit="q"]');
      if (u) u.textContent = word(it.unit.qty, p.q);
      var v = li.querySelector('[data-unit="v"]');
      if (v) v.textContent = word(['reize', 'reizes'], p.v);
    }

    // Result
    var usedAreas = function () {
      return AREAS.filter(function (a) { return order.some(function (id) { return ITEMS[id].area === a; }); });
    };
    function linesHTML(t) {
      var h = '', many = usedAreas().length > 1;
      AREAS.forEach(function (a) {
        var ls = t.lines.filter(function (l) { return l.it.area === a; });
        if (!ls.length) return;
        if (many) h += '<li class="pbc_lines-area">' + esc(a.name) + '</li>';
        ls.forEach(function (l) {
          h += '<li class="pbc_line"><button type="button" class="pbc_line-name" data-goto="' + l.it.id + '">' + esc(l.it.name) +
            '<span class="pbc_line-qty">' + esc(qtyText(l.it, l.p)) + '</span></button>' +
            '<span class="pbc_line-sum">' + (l.n > 0 ? money(l.mid) + (l.it.unit.monthly ? '/mēn.' : '') : '—') + '</span>' +
            '<button type="button" class="pbc_remove" data-remove="' + l.it.id + '" aria-label="Noņemt: ' + esc(l.it.name) + '">×</button></li>';
        });
      });
      return h;
    }
    function renderResult() {
      var t = totals(), any = order.length > 0, main = t.once.n ? t.once : t.month, monthOnly = !t.once.n && t.month.n;
      var used = usedAreas();
      var notes = used.map(function (a) { return (used.length > 1 ? a.name + ': ' : '') + a.note; });
      var h = '<div class="pbc_result-label">' + esc(S.resultLabel) + '</div>';
      if (!any) {
        h += '<p class="pbc_total is-empty">— €</p><p class="pbc_range">' + esc(S.resultEmpty) + '</p>';
      } else if (!main.n) {
        h += '<p class="pbc_total is-empty">— €</p><p class="pbc_range">Norādiet izvēlēto darbu apjomu.</p>';
      } else {
        h += '<p class="pbc_total">≈ ' + money(main.mid) + (monthOnly ? '<span class="pbc_total-unit"> mēnesī</span>' : '') + '</p>' +
          '<p class="pbc_range">Iespējamais diapazons ' + range(main.lo, main.hi, ' – ') + (monthOnly ? ' mēnesī' : '') + '</p>';
        if (t.once.n && t.month.n) h += '<p class="pbc_month">+ ikmēneša maksa ≈ ' + money(t.month.mid) + ' <span>(' + range(t.month.lo, t.month.hi, ' – ') + ')</span></p>';
      }
      if (any) h += '<ul class="pbc_lines" role="list">' + linesHTML(t) + '</ul>';
      if (notes.length) h += '<p class="pbc_note">' + notes.map(esc).join('<br>') + '</p>';
      h += '<p class="pbc_note">' + esc(S.generalNote) + '</p>' +
        '<button type="button" class="pbc_cta" data-cta aria-disabled="' + !any + '">' + esc(S.cta) + icon.arrow + '</button>' +
        '<p class="pbc_cta-note" data-cta-note>' + esc(any ? S.ctaNote : S.ctaHint) + '</p>';
      el.result.innerHTML = h;
      renderBar(t, main, monthOnly);
      writeFields(t);
      announce(any && main.n ? S.resultLabel + ' ' + money(main.mid) + (monthOnly ? ' mēnesī' : '') + ', izvēlēti darbi: ' + order.length : '');
    }
    var announceTimer;
    function announce(msg) {
      clearTimeout(announceTimer);
      announceTimer = setTimeout(function () { el.status.textContent = msg; }, 900);
    }

    // Floating total while the list is on screen and the result is not
    var seen = { works: false, result: false, form: false };
    function renderBar(t, main, monthOnly) {
      var on = order.length > 0 && main.n > 0 && seen.works && !seen.result && !seen.form;
      el.bar.classList.toggle('is-shown', on);
      el.bar.querySelector('[data-to-result]').tabIndex = on ? 0 : -1;
      el.bar.setAttribute('aria-hidden', on ? 'false' : 'true');
      if (!main) return;
