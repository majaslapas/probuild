(function () {
  'use strict';
  var S = window.PBC_SETTINGS || {}, UNITS = S.units || {}, SVC = S.services || {};
  var html = document.documentElement, api = null, queue = [], moved = [];
  var NB = String.fromCharCode(160);
  var fold = function (s) { return String(s || '').toLowerCase().normalize('NFD').replace(/\p{M}/gu, ''); };
  var warn = function (m) { console.warn('[Kalkulators] ' + m); };
  // Other scripts and links: pbCalc.show('Jumta darbi'), pbCalc.request('Kokapstrāde'), ?pakalpojums=…
  window.pbCalc = {
    has: function (n) { return !!SVC[n] || !!(api && api.resolve(n)); },
    show: function (t, o) { if (api) return api.show(t, o); queue.push(['show', t, o]); return true; },
    reset: function () { if (api) api.reset(); },
    request: function (n) { if (api) api.request(n); else queue.push(['request', n]); }
  };
  html.classList.add('pbc-on');
  function off() {
    html.classList.remove('pbc-on'); html.classList.add('pbc-off');
    moved.forEach(function (m) { m[1].insertBefore(m[0], m[2]); });
    var r = document.querySelector('[data-pbc]');
    if (r) r.innerHTML = '<p class="pbc_intro">' + (S.unavailable || '') + '</p>';
  }
  function run() { try { init(); } catch (e) { console.error('[Kalkulators]', e); off(); } }
  if (document.querySelector('[data-pbc]')) run(); else document.addEventListener('DOMContentLoaded', run);

  // The price table: <script type="text/plain" data-pbc-cenas> blocks (see the block's own instructions).
  function readTables() {
    var areas = [], byId = {}, errors = [];
    var num = function (s) {
      s = s.replace(/[\s€]/g, '').replace(',', '.').replace('−', '-');
      return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
    };
    [].forEach.call(document.querySelectorAll('[data-pbc-cenas]'), function (block, bi) {
      var area = null, group = null, done = false;
      block.textContent.split(/\r?\n/).forEach(function (raw, li) {
        var s = raw.trim(), m;
        var fail = function (why) { errors.push((bi ? bi + 1 + '. bloka ' : '') + (li + 1) + '. rindā: ' + why + '\n   ' + s); };
        if (done || !s || s.charAt(0) === '#') return;
        if ((m = /^={3,}\s*(.*?)\s*=*$/.exec(s))) {
          if (!m[1]) return;
          if (fold(m[1]) === 'beigas') { done = true; return; }
          var id = fold(m[1]).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
          if (!byId[id]) areas.push(byId[id] = { id: id, name: m[1], intro: '', note: '', short: '', groups: [] });
          area = byId[id]; group = null;
          return;
        }
        if (!area) return;
        if ((m = /^-{3,}\s*(.*?)\s*-*$/.exec(s))) {
          if (m[1]) area.groups.push(group = { name: m[1], items: [] });
          return;
        }
        if (s.indexOf('|') < 0) {
          m = /^(apraksts|piezime|isa piezime)\s*:/.exec(fold(s));
          if (m) area[{ apraksts: 'intro', piezime: 'note' }[m[1]] || 'short'] = s.slice(s.indexOf(':') + 1).trim();
          else fail('nav saprotama rinda (starp kolonnām jābūt svītrai |)');
          return;
        }
        if (!group) return fail('darbs pirms grupas virsraksta „--- …”');
        var c = s.split('|').map(function (x) { return x.trim(); });
        if (c.length < 5 || !c[4]) return fail('jābūt kolonnām NO | CENA | LĪDZ | MĒRV. | DARBS');
        var lo = num(c[0]), mid = num(c[1]), hi = num(c[2]);
        if (isNaN(lo) || isNaN(mid) || isNaN(hi)) return fail('cenai jābūt skaitlim, piem. 12.5');
        if (!(lo <= mid && mid <= hi)) fail('jābūt NO ≤ CENA ≤ LĪDZ (rinda tomēr ir rādīta)');
        group.items.push({ name: c[4], unitKey: c[3], from: lo, price: mid, to: hi, note: c.slice(5).join(' | ') });
      });
    });
    areas.forEach(function (a) { a.groups = a.groups.filter(function (g) { return g.items.length; }); });
    return { areas: areas.filter(function (a) { return a.groups.length; }), errors: errors };
  }

  function init() {
    var root = document.querySelector('[data-pbc]');
    if (!root || root.hasAttribute('data-pbc-ready')) return;
    root.setAttribute('data-pbc-ready', '');

    var mq = function (q) { return window.matchMedia(q); };
    var mW = mq('(min-width:75em)'), mS = mq('(min-width:56.25em)'), mP = mq('(max-width:37.49em)'), mFine = mq('(pointer:fine)'), mRed = mq('(prefers-reduced-motion:reduce)');
    var L = function () { return mW.matches ? 'W' : mS.matches ? 'S' : mP.matches ? 'P' : 'N'; };
    var flow = function () { return !mS.matches; };
    var nf = function (o) { return new Intl.NumberFormat('lv-LV', o); };
    var nf0 = nf({ maximumFractionDigits: 0, useGrouping: 'always' }), nf2 = nf({ minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' }), nfq = nf({ maximumFractionDigits: 2, useGrouping: false });
    var minus = function (s) { return s.replace('-', '−'); };
    var num0 = function (n) { var r = Math.round(n * 100) / 100; return minus(Math.abs(r) >= 100 || r === Math.round(r) ? nf0.format(Math.round(r)) : nf2.format(r)); };
    var money = function (n) { return num0(n) + NB + '€'; };
    var rate = function (n) { return minus(n === Math.round(n) ? nf0.format(n) : nf2.format(n)); };
    var rng = function (lo, hi, f, sp) { return lo === hi ? f(lo) : f(lo) + (sp || lo < 0 ? ' – ' : '–') + f(hi); };
    var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var fill = function (s, o) { return String(s).replace(/\{(\w)\}/g, function (x, k) { return o[k]; }); };
    var word = function (f, n) { if (typeof f === 'string') return f; var i = Math.abs(Math.round(n)); return i % 10 === 1 && i % 100 !== 11 ? f[0] : f[1]; };
    var cnt = function (n, f) { return n + ' ' + word(f, n); };
    var DARBI = ['darbs', 'darbi'], VEIDI = ['darbu veids', 'darbu veidi'], IZV = ['izvēlēts', 'izvēlēti'], REIZES = ['reize', 'reizes'];
    var sr = function (s) { return '<span class="pbc_sr">' + s + '</span>'; };
    var badge = function (n) { return n ? '<span class="pbc_badge">' + sr(', izvēlēti: ') + n + '</span>' : ''; };
    var countH = function (n) { return '<span class="pbc_count">' + sr(', darbi: ') + n + '</span>'; };
    var svg = function (d) { return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; };
    var IC = { search: svg('<circle cx="8.5" cy="8.5" r="5.75"/><path d="m13 13 4.5 4.5"/>'), right: svg('<path d="m8 5 5 5-5 5"/>'), down: svg('<path d="m5 8 5 5 5-5"/>'), back: svg('<path d="M16 10H4m5-5-5 5 5 5"/>'), next: svg('<path d="M4 10h12m-5-5 5 5-5 5"/>') };
    var $ = function (s, r) { return (r || root).querySelector(s); };
    var $$ = function (s, r) { return [].slice.call((r || root).querySelectorAll(s)); };

    // Data
    var tab = readTables(), AREAS = tab.areas, ITEMS = {};
    tab.errors.forEach(warn);
    AREAS.forEach(function (a, ai) {
      a.i = ai;
      a.groups.forEach(function (g, gi) {
        g.i = gi; g.area = a;
        g.items.forEach(function (it, ii) {
          it.id = ai + '-' + gi + '-' + ii; it.area = a; it.group = g;
          if (!UNITS[it.unitKey]) { warn('Nezināma mērvienība „' + it.unitKey + '”: ' + it.name); UNITS[it.unitKey] = { price: '€/' + it.unitKey, qty: it.unitKey }; }
          it.unit = UNITS[it.unitKey];
          it.key = fold(it.name + ' ' + g.name + ' ' + a.name);
          ITEMS[it.id] = it;
        });
      });
    });
    if (!AREAS.length) return off();

    // State
    var st = { a: 0, g: 0, o: -1, q: '', stems: [], view: 'areas', prev: null };
    var lastG = {}, picked = {}, order = [], lastQty = {}, linesKey = null;
    var area = function () { return AREAS[st.a]; };
    var countIn = function (test) { return order.filter(function (id) { return test(ITEMS[id]); }).length; };
    var countA = function (a) { return countIn(function (it) { return it.area === a; }); };
    var countG = function (g) { return countIn(function (it) { return it.group === g; }); };

    // Forms (native Webflow form blocks, moved into the dialogs)
    var block = function (sel) { var el = document.querySelector(sel); return el && (el.closest('.w-form') || el); };
    var offerBlock = block('[data-pbc-form]'), reqBlock = block('[data-pbc-request]');
    var form = offerBlock && (offerBlock.tagName === 'FORM' ? offerBlock : offerBlock.querySelector('form'));

    var X = function (lbl) { return '<button type="button" class="pbc_x" data-close aria-label="' + esc(lbl) + '">×</button>'; };
    var dlgHead = function (id, t) { return '<div class="pbc_dlg-h"><h2 id="' + id + '">' + esc(t) + '</h2>' + X(S.close) + '</div>'; };
    var quiet = function (lead, pill) {
      return (lead ? '<span>' + esc(lead) + '</span> ' : '') + '<button type="button" class="' + (pill ? 'pbc_pill' : 'pbc_link') + '" data-request>' + esc(S.quietBtn) + '</button>';
    };
    var errBox = tab.errors.length && (/webflow\.io$/.test(location.hostname) || /pbc-check/.test(location.search))
      ? '<div class="pbc_err" role="alert"><b>Cenu tabulā ir kļūdas (šo redz tikai …webflow.io adresē):</b>\n' + esc(tab.errors.join('\n')) + '</div>' : '';
    root.innerHTML = errBox +
      '<header class="pbc_head"><div><h2 class="pbc_title">' + esc(S.title) + '</h2><p class="pbc_intro">' + esc(S.intro) + '</p></div><p class="pbc_quiet">' + quiet(S.quietLead, 1) + '</p></header>' +
      '<div class="pbc_ws" id="pbc-ws">' +
        '<nav class="pbc_nav" aria-label="' + esc(S.navLabel) + '">' +
          '<div class="pbc_search" role="search"><label for="pbc-q">' + esc(S.searchLabel) + '</label><div class="pbc_field">' + IC.search +
            '<input class="pbc_q" id="pbc-q" type="search" autocomplete="off" enterkeyhint="search" placeholder="' + esc(S.search) + '">' +
            '<button type="button" class="pbc_clear" data-clear aria-label="' + esc(S.searchClear) + '" hidden>×</button></div></div>' +
          '<div class="pbc_nav-h"><h3 id="pbc-nav-title" tabindex="-1">' + esc(S.navTitle) + '</h3><p>' + esc(S.navHint) + '</p>' +
            '<ul class="pbc_areas" role="list" data-areas></ul></div>' +
          '<div class="pbc_groups"><p class="pbc_glabel" id="pbc-gl">' + esc(S.groupsLabel) + '</p><ul role="list" aria-labelledby="pbc-gl" data-groups></ul></div>' +
        '</nav>' +
        '<section class="pbc_works" aria-labelledby="pbc-works-title"><div class="pbc_wh" data-wh></div><div class="pbc_sets" data-sets></div><div class="pbc_wf" data-wf></div></section>' +
        '<aside class="pbc_sum" aria-labelledby="pbc-sum-title" data-sum>' +
          '<div class="pbc_sum-h"><h3 id="pbc-sum-title">' + esc(S.resultTitle) + '</h3><span class="pbc_sum-n" data-sum-n></span>' +
            '<button type="button" class="pbc_link" data-clearall hidden>' + esc(S.clear) + '</button>' + X(S.closeSum) + '</div>' +
          '<div class="pbc_sum-b"><div class="pbc_tot" data-tot></div><ul class="pbc_lines" role="list" data-lines></ul><div class="pbc_how" data-how></div></div>' +
          '<div class="pbc_foot"><button type="button" class="pbc_cta" data-cta aria-describedby="pbc-cta-n">' + esc(S.cta) + '</button>' +
            '<p class="pbc_cta-n" id="pbc-cta-n" data-cta-n></p><p class="pbc_quiet-in">' + quiet() + '</p></div>' +
        '</aside>' +
      '</div>' +
      '<div class="pbc_dock" role="region" aria-label="' + esc(S.dockLabel) + '" data-dock hidden>' +
        '<div class="pbc_dock-m"><span class="pbc_dock-t" data-dt></span><span class="pbc_dock-i" data-di></span><span class="pbc_dock-n" data-dn></span></div>' +
        '<button type="button" class="pbc_pill pbc_dock-o" data-open-sum aria-haspopup="dialog"><span class="pbc_dock-l">' + esc(S.dockOpen) + '</span><span class="pbc_dock-s">' + esc(S.dockOpenShort) + ' <span class="pbc_badge" data-dc></span></span></button>' +

      '</div>' +
