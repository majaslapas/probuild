.navbar_component *,.navbar_component *::before,.navbar_component *::after{box-sizing:border-box}
.navbar_link{color:#D8D8D8;text-decoration:none;font-size:.9375rem;padding:.5rem 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}

.navbar_component a:focus-visible{outline:2px solid #F2600C;outline-offset:3px}
.navbar_button{touch-action:manipulation;transition:background-color .2s,transform .16s cubic-bezier(.23,1,.32,1)}
.navbar_button:active{transform:scale(.97)}
@media (max-width:991px){.navbar_phone{display:none}}
