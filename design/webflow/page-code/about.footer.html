<script>
// Par mums: video cards (CMS „Video par uzņēmumu“). The card link holds the YouTube address. The script shows the
// video's cover image and starts the player (youtube-nocookie.com) only after a click, so YouTube's player and
// cookies never load just by opening the page. Without the script the link opens the video on YouTube.
(function () {
  var re = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/;
  [].forEach.call(document.querySelectorAll('a[data-yt]'), function (a) {
    var m = (a.getAttribute('href') || '').match(re);
    if (!m) return;
    var id = m[1], title = (a.getAttribute('data-yt-title') || '').trim() || 'Video';
    a.setAttribute('aria-label', 'Atskaņot video: ' + title);
    var img = new Image(), hq = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
    img.className = 'about-video_thumb'; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
    img.onload = function () { if (img.naturalWidth < 200 && img.src !== hq) img.src = hq; };
    img.onerror = function () { img.onerror = null; if (img.src !== hq) img.src = hq; };
    img.src = 'https://i.ytimg.com/vi/' + id + '/maxresdefault.jpg';
    a.insertBefore(img, a.firstChild);
    a.addEventListener('click', function (e) {
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button) return;
      e.preventDefault();
      var box = document.createElement('div'), f = document.createElement('iframe');
      box.className = a.className.replace(/\bw-inline-block\b/, '').trim() + ' is-playing';
      f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1';
      f.title = title;
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      f.allowFullscreen = true;
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      box.appendChild(f);
      a.parentNode.replaceChild(box, a);
      f.focus();
    });
  });
})();
</script>
