<style>
.page-wrapper{overflow-x:clip}
.services-list_trigger:hover .services-list_name{color:var(--christine--light)}
.services-list_trigger:hover .services-list_more{background:#272727;color:var(--neutral--white)}
.services-list_item.is-open .services-list_more{background:var(--christine--primary);color:var(--neutral--darkest)}
.services-list_item.is-open .services-list_chevron{transform:rotate(180deg);background:rgba(0,0,0,.15)}
.services-list_prices p{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:0;padding:.875rem 1.125rem;font-size:.9375rem;color:var(--neutral--light)}
.services-list_prices p+p{border-top:1px solid var(--opacity--white-10)}
.services-list_prices strong{font-family:var(--font--heading);font-weight:400;color:var(--neutral--white);white-space:nowrap;font-variant-numeric:tabular-nums}
.services-list_includes ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.services-list_includes li{position:relative;padding-left:1.5rem;line-height:1.5;color:var(--neutral--lighter)}
.services-list_includes li::before{content:"";position:absolute;left:0;top:.55em;width:.5rem;height:.5rem;border-radius:2px;background:var(--christine--primary)}
.services-list_item.is-open{background-color:#1F1F1F;box-shadow:inset 0 0 0 1px rgba(242,96,12,.6)}
.services-list_item:not(.is-open) .services-list_panel{display:none}
#pakalpojumi{scroll-margin-top:2rem}
/* Brand bars: the hosts clip them and keep their content above them */
.prices-hero_cta,.section_prices-cta{isolation:isolate}
/* Questions (details/summary) */
.prices-faq_item summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;min-height:4rem;padding:1.25rem 0;cursor:pointer}
.prices-faq_item summary::-webkit-details-marker{display:none}
.prices-faq_item summary::after{content:"+";flex:none;font-family:var(--font--heading),monospace;font-size:1.5rem;line-height:1;color:var(--christine--primary)}
.prices-faq_item[open] summary::after{content:"\2212"}
.prices-faq_question{transition:color .2s}
@media (hover:hover) and (pointer:fine){.prices-faq_item summary:hover .prices-faq_question{color:var(--christine--light)}}
.prices-faq_item summary:focus-visible{outline:2px solid var(--christine--primary);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.prices-hero_content>*,.prices-hero_cta{animation:rise .8s cubic-bezier(.23,1,.32,1) both}.prices-hero_content>*:nth-child(2){animation-delay:.08s}.prices-hero_content>*:nth-child(3){animation-delay:.16s}.prices-hero_content>*:nth-child(4),.prices-hero_cta{animation-delay:.24s}.services-list_panel,.prices-faq_item[open] .prices-faq_answer{animation:open .3s cubic-bezier(.23,1,.32,1) both}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
</style>
