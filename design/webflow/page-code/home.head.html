<style>
.home-hero_logos img{height:1.375rem;width:auto;opacity:.7;transition:opacity .2s}
.home-hero_logos img:hover{opacity:1}
/* Service cards: the shade is measured from the card's bottom edge, so the text gets the same shade on tall and short cards */
.home-services_item::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(0,0,0,.9) 0,rgba(0,0,0,.7) 12rem,rgba(0,0,0,0) 26rem)}

.home-services_link::after{content:"";position:absolute;inset:0;z-index:1}

.home-services_item:has(.home-services_link:focus-visible){outline:2px solid var(--christine--primary);outline-offset:3px}

.rental-card_image img{transition:transform .6s cubic-bezier(.23,1,.32,1)}
