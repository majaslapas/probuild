<script>
// Privātuma politika and Sīkdatņu politika (same code on both pages, before </body>): the "Saturs" list
// ([data-legal-toc], shown on desktop) is built from the h2 headings of the policy text (.legal_rich-text), so it
// follows any edit of the text. Each heading gets an id from its words (#kas-apstrada-jusu-datus) for links to a
// section, and the section being read is marked. Styles in the page head code.
(function () {
  var toc = document.querySelector('[data-legal-toc]');
  var hs = Array.prototype.slice.call(document.querySelectorAll('.legal_rich-text h2'));
  if (!toc || hs.length < 2) return;
  var slug = function (s) {
    return s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  };
  var list = document.createElement('ol'), links = [];
  hs.forEach(function (h, i) {
    if (!h.id) h.id = slug(h.textContent.replace(/^\s*\d+\.\s*/, '')) || 'sadala-' + (i + 1);
    var li = document.createElement('li'), a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent.trim();
    li.appendChild(a);
    list.appendChild(li);
    links.push(a);
  });
  toc.appendChild(list);
  toc.classList.add('is-ready');
  var queued = false;
  var mark = function () {
    queued = false;
    var cur = 0;
    hs.forEach(function (h, i) { if (h.getBoundingClientRect().top < innerHeight * 0.3) cur = i; });
    links.forEach(function (a, i) {
      a.classList.toggle('is-current', i === cur);
      if (i === cur) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
    });
  };
  window.addEventListener('scroll', function () { if (!queued) { queued = true; requestAnimationFrame(mark); } }, { passive: true });
  mark();
})();
</script>
